# ---------- prebuilt tarball generation (follow-me pattern) ------------
# Declare this recipe as part of the HY22 prebuilt variant set.
PREBUILT_VARIANTS = "HY22"

# The qprebuilt do_generate_prebuilt task will produce:
#   ${DEPLOY_DIR}/prebuilts/HY22/vio_${PV}_${PACKAGE_ARCH}.tar.gz
HY22_PREBUILT_PACKAGES += "vio"

# Enumerate every installed file explicitly so the generated tarball has
# correct paths (qprebuilt splits each entry into <dir> + <regex filename> and
# appends it relative to ${D}).
#
# vio is a ROS2 ament_cmake package (ROS_BPN=qrb_ros_vio) installed under the
# ROS prefix ${ros_prefix}=/usr/ros/jazzy.  This list matches the actual ${D}
# produced by do_install (ament_auto_add_executable vio_node,
# ament_auto_add_library qrb_ros_vio SHARED, exported headers, INSTALL_TO_SHARE
# launch, ament resource index + rclcpp_components registration).
PREBUILT_FILES:pn-vio = " \
    ${ros_prefix}/lib/qrb_ros_vio/vio_node \
    ${ros_prefix}/lib/libqrb_ros_vio.so \
    ${ros_prefix}/include/vio_apicheck.hpp \
    ${ros_prefix}/include/vio_component.hpp \
    ${ros_prefix}/include/VISLAMSystem.h \
    ${ros_prefix}/include/VISLAMSystemROS2.h \
    ${ros_prefix}/share/ament_index/resource_index/packages/qrb_ros_vio \
    ${ros_prefix}/share/ament_index/resource_index/rclcpp_components/qrb_ros_vio \
    ${ros_prefix}/share/qrb_ros_vio/cmake \
    ${ros_prefix}/share/qrb_ros_vio/environment \
    ${ros_prefix}/share/qrb_ros_vio/launch \
    ${ros_prefix}/share/qrb_ros_vio/local_setup.bash \
    ${ros_prefix}/share/qrb_ros_vio/local_setup.dsv \
    ${ros_prefix}/share/qrb_ros_vio/local_setup.sh \
    ${ros_prefix}/share/qrb_ros_vio/local_setup.zsh \
    ${ros_prefix}/share/qrb_ros_vio/package.dsv \
    ${ros_prefix}/share/qrb_ros_vio/package.xml \
"

# Upstream component metadata - mirrors the follow-me pattern.  Not read by
# qprebuilt.bbclass itself; consumed by internal tooling to correlate the
# generated tarball with its source commit.
PREBUILT_COMPONENT_TAG:pn-vio = "${ROBOT_PBT_BUILD_ID}"
PREBUILT_PKG_PRJNAME:pn-vio   = "platform/vendor/qcom-proprietary/robot-vio"
PREBUILT_PKG_UPSTREAM:pn-vio  = "refs/heads/LE.QCROBOTICS.1.0.R1"
