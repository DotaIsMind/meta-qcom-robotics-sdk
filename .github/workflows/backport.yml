name: Backport merged pull request
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write # so it can comment
  pull-requests: write # so it can create pull requests
jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest
    # Don't run on closed unmerged pull requests
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and rebase backport branch (if exists)
        run: |
          git fetch origin backport/${pull_number}-to-${target_branch} || true
          git rebase origin/backport/${pull_number}-to-${target_branch} || true
        continue-on-error: true
      - name: Create backport pull requests
        uses: korthout/backport-action@7c3f6cd5843cac11bc59a04a1b7699af93261670
        with:
          # backport PR ----- 
          github_token: ${{ secrets.PR_AUTO_MERGE_TOKEN }}
          label_pattern: "^backport (wrynose)$"
          branch_name: "backport/${pull_number}-to-${target_branch}"
